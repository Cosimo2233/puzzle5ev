Section "Files"
    FontPath "/usr/share/fonts/ttf/ec26e"
    FontPath "/usr/share/fonts/ttf"
    FontPath "built-ins"
EndSection
Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoBindGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "ec26e-hdmi"
    Driver "fbdev"
    Option "fbdev" "/dev/ec26e-hdmi-fb"
    Option "SWCursor" "true"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "ec26e-hdmi"
    DefaultDepth 24
EndSection
Section "ServerLayout"
    Identifier "Layout0"
    Screen "Screen0"
EndSection
